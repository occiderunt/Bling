[package]
name = "bling"
version = "1.0.0"
description = "Peer-to-peer chat over libp2p"
authors = ["Bling"]
edition = "2021"
rust-version = "1.77"
default-run = "bling"

[lib]
name = "bling"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
libp2p = { version = "0.57", features = [
  "tokio",
  "tcp",
  "quic",
  "noise",
  "yamux",
  "gossipsub",
  "mdns",
  "identify",
  "ping",
  "macros",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
