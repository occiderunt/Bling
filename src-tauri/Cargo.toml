[package]
name = "bling"
version = "1.2.0"
description = "Peer-to-peer chat over libp2p"
authors = ["Bling"]
edition = "2021"
rust-version = "1.90"
default-run = "bling"

[lib]
name = "bling"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
qrcode = { version = "0.15", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
libp2p = { version = "0.57", features = [
  "tokio",
  "tcp",
  "quic",
  "noise",
  "yamux",
  "gossipsub",
  "mdns",
  "identify",
  "ping",
  "macros",
] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
